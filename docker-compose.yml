services:
  redis-node-1:
    image: redis:7.2
    container_name: redis-node-1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - ./infra/redis/redis-7001.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node-1-data:/data
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.11

  redis-node-2:
    image: redis:7.2
    container_name: redis-node-2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - ./infra/redis/redis-7002.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node-2-data:/data
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.12

  redis-node-3:
    image: redis:7.2
    container_name: redis-node-3
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - ./infra/redis/redis-7003.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node-3-data:/data
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.13

  redis-node-4:
    image: redis:7.2
    container_name: redis-node-4
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - ./infra/redis/redis-7004.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node-4-data:/data
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.14

  redis-node-5:
    image: redis:7.2
    container_name: redis-node-5
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - ./infra/redis/redis-7005.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node-5-data:/data
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.15

  redis-node-6:
    image: redis:7.2
    container_name: redis-node-6
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "7006:7006"
      - "17006:17006"
    volumes:
      - ./infra/redis/redis-7006.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node-6-data:/data
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.16

  app1:
    build: .
    container_name: redis-cluster-lab-app1
    profiles: ["app"]
    environment:
      SERVER_PORT: 8080
      APP_INSTANCE_NAME: app1
      SPRING_DATA_REDIS_CLUSTER_NODES: 172.28.0.11:7001,172.28.0.12:7002,172.28.0.13:7003,172.28.0.14:7004,172.28.0.15:7005,172.28.0.16:7006
    ports:
      - "8081:8080"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.21

  app2:
    build: .
    container_name: redis-cluster-lab-app2
    profiles: ["app"]
    environment:
      SERVER_PORT: 8080
      APP_INSTANCE_NAME: app2
      SPRING_DATA_REDIS_CLUSTER_NODES: 172.28.0.11:7001,172.28.0.12:7002,172.28.0.13:7003,172.28.0.14:7004,172.28.0.15:7005,172.28.0.16:7006
    ports:
      - "8082:8080"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.22

  app3:
    build: .
    container_name: redis-cluster-lab-app3
    profiles: ["app"]
    environment:
      SERVER_PORT: 8080
      APP_INSTANCE_NAME: app3
      SPRING_DATA_REDIS_CLUSTER_NODES: 172.28.0.11:7001,172.28.0.12:7002,172.28.0.13:7003,172.28.0.14:7004,172.28.0.15:7005,172.28.0.16:7006
    ports:
      - "8083:8080"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.23

  redis-exporter-7001:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter-7001
    profiles: ["observability"]
    command: ["--redis.addr=redis://172.28.0.11:7001"]
    ports:
      - "9121:9121"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.31

  redis-exporter-7002:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter-7002
    profiles: ["observability"]
    command: ["--redis.addr=redis://172.28.0.12:7002"]
    ports:
      - "9122:9121"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.32

  redis-exporter-7003:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter-7003
    profiles: ["observability"]
    command: ["--redis.addr=redis://172.28.0.13:7003"]
    ports:
      - "9123:9121"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.33

  redis-exporter-7004:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter-7004
    profiles: ["observability"]
    command: ["--redis.addr=redis://172.28.0.14:7004"]
    ports:
      - "9124:9121"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.34

  redis-exporter-7005:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter-7005
    profiles: ["observability"]
    command: ["--redis.addr=redis://172.28.0.15:7005"]
    ports:
      - "9125:9121"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.35

  redis-exporter-7006:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter-7006
    profiles: ["observability"]
    command: ["--redis.addr=redis://172.28.0.16:7006"]
    ports:
      - "9126:9121"
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.36

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: redis-cluster-lab-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.40

  grafana:
    image: grafana/grafana:11.3.1
    container_name: redis-cluster-lab-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      redis-cluster-net:
        ipv4_address: 172.28.0.41

networks:
  redis-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:
  prometheus-data:
  grafana-data:
